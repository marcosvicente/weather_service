
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: weather_service_development
  host: db
  username: postgres
  password: postgres

test:
  <<: *default
  database: weather_service_test
  host: db
  username: postgres
  password: postgres


production:
  primary: &primary_production
    <<: *default
    database: weather_service_production
    username: weather_service
    password: <%= ENV["WEATHER_SERVICE_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: weather_service_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: weather_service_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: weather_service_production_cable
    migrations_paths: db/cable_migrate
